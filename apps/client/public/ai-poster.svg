<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="240" viewBox="0 0 1440 240" fill="none">
  <defs>
    <!-- Premium Healthcare Gradient Background -->
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1440" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7" />
      <stop offset="0.45" stop-color="#0369A1" />
      <stop offset="0.85" stop-color="#0F172A" />
      <stop offset="1" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Glowing Background Accents -->
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&amp;display=swap');
      .google-sans-title {
        font-family: 'Google Sans', 'Google Sans Text', sans-serif;
        font-weight: 800;
      }
      .google-sans-sub {
        font-family: 'Google Sans', 'Google Sans Text', sans-serif;
        font-weight: 400;
      }
      .google-sans-btn {
        font-family: 'Google Sans', 'Google Sans Text', sans-serif;
        font-weight: 700;
      }
      .google-sans-ui {
        font-family: 'Google Sans', 'Google Sans Text', sans-serif;
      }
    </style>
  </defs>

  <!-- Banner Outer Container -->
  <rect width="1440" height="240" rx="24" fill="url(#banner-bg)" />

  <!-- Background Light Bubbles & Glows -->
  <circle cx="150" cy="40" r="160" fill="#38BDF8" opacity="0.15" filter="url(#soft-blur)" />
  <circle cx="1250" cy="200" r="180" fill="#6366F1" opacity="0.2" filter="url(#soft-blur)" />
  <circle cx="950" cy="60" r="120" fill="#0EA5E9" opacity="0.12" filter="url(#soft-blur)" />

  <!-- Subtle Decorative Grid Lines -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="1440" y2="60" stroke-dasharray="6 6" />
    <line x1="0" y1="120" x2="1440" y2="120" stroke-dasharray="6 6" />
    <line x1="0" y1="180" x2="1440" y2="180" stroke-dasharray="6 6" />
  </g>

  <!-- Left Side Content Area with Google Sans UI Typography -->
  <g transform="translate(64, 0)">
    <!-- Main Headline with UI Google Sans Font -->
    <text x="0" y="88" fill="#FFFFFF" class="google-sans-title" font-size="38" letter-spacing="-0.5">
      Ask anything about your health.
    </text>

    <!-- Subtitle with UI Google Sans Font -->
    <text x="0" y="126" fill="#E0F2FE" class="google-sans-sub" font-size="18" opacity="0.95">
      Get trusted AI-powered answers and health report insights directly from Care Hub.
    </text>

    <!-- Dark Pill Button Badge with UI Google Sans Font -->
    <g transform="translate(0, 148)" cursor="pointer">
      <rect width="210" height="48" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
      
      <!-- Plus / Sparkle Icon -->
      <path d="M26 24H36M31 19V29" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="39" cy="18" r="2" fill="#818CF8" />

      <!-- Button Label Text -->
      <text x="46" y="29" fill="#FFFFFF" class="google-sans-btn" font-size="16">
        Ask Care Hub
      </text>
      <text x="156" y="23" fill="#38BDF8" class="google-sans-btn" font-size="10">
        beta
      </text>
    </g>
  </g>

  <!-- Right Side Visual Illustration (Sleek Modern Medical & AI Report Graphic) -->
  <g transform="translate(940, 24)" filter="url(#card-shadow)">
    <!-- Glassmorphism Card 1: Medical Diagnostic Card -->
    <rect x="0" y="0" width="440" height="192" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />

    <!-- Card Top Header Bar -->
    <rect x="20" y="18" width="400" height="38" rx="8" fill="#0F172A" fill-opacity="0.5" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1" />
    
    <!-- Heartbeat Stethoscope Icon -->
    <path d="M35 37C35 37 40 37 43 37L46 29L50 44L54 33L57 37H65" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="74" y="42" fill="#F8FAFC" class="google-sans-ui" font-weight="600" font-size="13">Smart Health Diagnostic Report</text>
    
    <!-- Status Badge -->
    <rect x="310" y="26" width="95" height="22" rx="11" fill="#059669" fill-opacity="0.25" stroke="#34D399" stroke-width="1" />
    <circle cx="322" cy="37" r="3.5" fill="#34D399" />
    <text x="331" y="41" fill="#6EE7B7" class="google-sans-ui" font-weight="700" font-size="10">VERIFIED AI</text>

    <!-- Pulse Chart Graphic Inside Card -->
    <rect x="20" y="68" width="250" height="104" rx="10" fill="#0F172A" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.08" />
    <path d="M32 120 L65 120 L75 96 L88 138 L102 84 L118 132 L128 120 L175 120 L185 105 L195 128 L205 120 L255 120" 
          fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="102" cy="84" r="4" fill="#38BDF8" />
    <text x="32" y="88" fill="#94A3B8" class="google-sans-ui" font-weight="500" font-size="11">Vitals Analysis</text>
    <text x="32" y="156" fill="#34D399" class="google-sans-ui" font-weight="700" font-size="12">99.2% Health Accuracy</text>

    <!-- Side Metrics Pill Box -->
    <rect x="282" y="68" width="138" height="104" rx="10" fill="#0F172A" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.08" />
    
    <text x="294" y="90" fill="#64748B" class="google-sans-ui" font-weight="700" font-size="10">AI SUMMARY</text>
    
    <circle cx="298" cy="110" r="3.5" fill="#38BDF8" />
    <text x="308" y="113" fill="#E2E8F0" class="google-sans-ui" font-size="11">Lab Report Check</text>
    
    <circle cx="298" cy="130" r="3.5" fill="#818CF8" />
    <text x="308" y="133" fill="#E2E8F0" class="google-sans-ui" font-size="11">Doctor Chat</text>

    <circle cx="298" cy="150" r="3.5" fill="#34D399" />
    <text x="308" y="153" fill="#E2E8F0" class="google-sans-ui" font-size="11">Safe Vault</text>
  </g>
</svg>